<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layout/layout :: html(~{::section})}">
<section>
    <link th:href="@{/css/review/review-add.css}" rel="stylesheet">

    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-lg-8 mb-5 mx-auto">
                <div class="bg-light p-30">
                    <h2 class="mb-4">리뷰 작성</h2>

                    <!-- Book Info -->
                    <div class="book-info">
                        <img th:if="${thumbnail}" th:src="${thumbnail.imageUrl()}" alt="Book Cover" />
                        <h4 th:text="${bookInfo.title}">Book Title</h4>
                    </div>

                    <form th:action="@{/reviews}" method="post">
                        <input type="hidden" name="orderedBookId" th:value="${orderedBookId}" />
                        <input type="hidden" name="memberId" th:value="${memberId}" />
                        <input type="hidden" name="bookId" th:value="${bookInfo.id}" />

                        <!-- Review Image Management -->
                        <div class="form-group">
                            <label for="review-image-upload-input">리뷰 이미지 추가</label>
                            <input type="file" class="form-control-file" id="review-image-upload-input" accept="image/*">
                            <small id="review-image-status" class="form-text"></small>
                        </div>
                        <div id="review-images-preview-container" class="row mt-3 mb-3"></div>
                        <div id="review-image-urls-container">
                            <!-- Hidden inputs for image URLs will be added here by JS -->
                        </div>


                        <div class="form-group">
                            <label>별점</label>
                            <div class="star-rating">
                                <input type="radio" id="5-stars" name="rating" value="5" /><label for="5-stars" class="star">&#9733;</label>
                                <input type="radio" id="4-stars" name="rating" value="4" /><label for="4-stars" class="star">&#9733;</label>
                                <input type="radio" id="3-stars" name="rating" value="3" /><label for="3-stars" class="star">&#9733;</label>
                                <input type="radio" id="2-stars" name="rating" value="2" /><label for="2-stars" class="star">&#9733;</label>
                                <input type="radio" id="1-star"  name="rating" value="1" /><label for="1-star" class="star">&#9733;</label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="comment">리뷰 내용</label>
                            <textarea id="comment" class="form-control" rows="5" name="comment" required></textarea>
                        </div>

                        <div class="col-md-12">
                            <button type="submit" class="btn btn-primary">리뷰 등록</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/review-image-upload.js}"></script>
</section>
</html>
