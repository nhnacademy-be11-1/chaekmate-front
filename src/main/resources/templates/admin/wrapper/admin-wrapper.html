<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{admin/layout/admin-layout :: html(~{::section})}">

<section>
    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-12">

                <!-- 제목 + 추가 버튼 -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="h2 font-weight-bold text-dark">포장지 관리</h2>

                    <button class="btn btn-primary" data-toggle="modal" data-target="#createModal">
                        포장지 추가
                    </button>
                </div>

                <!-- 리스트 테이블 -->
                <div class="table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead class="thead-dark">
                        <tr>
                            <th>포장지 이름</th>
                            <th>가격</th>
                            <th>수정</th>
                            <th>삭제</th>
                        </tr>
                        </thead>
                        <tbody>

                        <!-- empty row -->
                        <tr th:if="${wrappers == null or wrappers.size() == 0}">
                            <td colspan="4" class="text-center">등록된 포장지가 없습니다.</td>
                        </tr>

                        <!-- list -->
                        <tr th:each="wrapper : ${wrappers}">
                            <td th:text="${wrapper.name}"></td>
                            <td th:text="${#numbers.formatInteger(wrapper.price, 3, 'COMMA') + ' 원'}"></td>

                            <!-- 수정 버튼 -->
                            <td class="text-center">
                                <button class="btn btn-sm btn-warning"
                                        data-toggle="modal"
                                        data-target="#editModal"
                                        th:data-id="${wrapper.id}"
                                        th:data-name="${wrapper.name}"
                                        th:data-price="${wrapper.price}">
                                    수정
                                </button>
                            </td>

                            <!-- 삭제 -->
                            <td class="text-center">
                                <form th:action="@{'/admin/wrappers/' + ${wrapper.id}}" method="post"
                                      onsubmit="return confirm('정말 삭제하시겠습니까?');">
                                    <input type="hidden" name="_method" value="delete"/>
                                    <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                                </form>
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <!-- 포장지 추가 모달 -->
    <div class="modal fade" id="createModal">
        <div class="modal-dialog">
            <form class="modal-content" method="post" th:action="@{/admin/wrappers}">
                <div class="modal-header">
                    <h5 class="modal-title">포장지 추가</h5>
                    <button class="close" data-dismiss="modal">&times;</button>
                </div>

                <div class="modal-body">
                    <label>포장지 이름</label>
                    <input type="text" name="name" class="form-control" required>

                    <label class="mt-3">가격</label>
                    <input type="number" name="price" class="form-control" required>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary">등록</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 포장지 수정 모달 -->
    <div class="modal fade" id="editModal">
        <div class="modal-dialog">
            <form class="modal-content" method="post" id="editForm">

                <div class="modal-header">
                    <h5 class="modal-title">포장지 수정</h5>
                    <button class="close" data-dismiss="modal">&times;</button>
                </div>

                <div class="modal-body">

                    <!-- form 내부에서만 쓰는 id -->
                    <input type="hidden" id="edit-id" name="id">

                    <label>포장지 이름</label>
                    <input type="text" id="edit-name" name="name" class="form-control" required>

                    <label class="mt-3">가격</label>
                    <input type="number" id="edit-price" name="price" class="form-control" required>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary">저장</button>
                </div>

            </form>
        </div>
    </div>

</section>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const editModalEl = document.getElementById("editModal");

        editModalEl.addEventListener("show.bs.modal", function (event) {
            const button = event.relatedTarget;

            const id = button.getAttribute("data-id");
            const name = button.getAttribute("data-name");
            const price = button.getAttribute("data-price");

            console.log("modal open", {id, name, price});

            document.getElementById("edit-id").value = id;
            document.getElementById("edit-name").value = name;
            document.getElementById("edit-price").value = price;

            document.getElementById("editForm").action = "/admin/wrappers/" + id;
        });
    });
</script>

</html>
