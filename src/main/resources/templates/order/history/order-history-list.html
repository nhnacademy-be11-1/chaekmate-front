<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko"
      th:replace="~{layout/layout :: html(~{::section})}">
<section>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>

    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-12">
                <h2 class="mb-4">주문 내역</h2>

                <!-- No Orders Message -->
                <div th:if="${pagedResponse.isEmpty()}" class="text-center my-5">
                    <h3>주문 내역이 없습니다.</h3>
                </div>

                <!-- Orders List -->
                <div th:if="${not pagedResponse.isEmpty()}" >
                    <div th:each="order : ${pagedResponse.content}" class="card mb-3">
                        <div class="card-header">
                            <h5 class="mb-0 d-flex justify-content-between align-items-center">
                                <div>
                                    <span th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd')}"></span>
                                    | <span th:text="'주문번호: ' + ${order.orderNumber}"></span>
                                </div>
                                <div>
                                    <span class="badge badge-primary p-2 mr-2" th:text="${order.status}"></span>
                                    <a th:href="'/orders/' + ${order.orderId} + '/detail'" class="badge-info btn btn-sm">주문 상세</a>
                                </div>
                            </h5>
                        </div>

                        <div>
                            <div class="card-body">
                                <table class="table table-bordered text-center mb-4">
                                    <thead class="bg-secondary text-dark">
                                    <tr>
                                        <th>상품 정보</th>
                                        <th>수량</th>
                                        <th>상품구매금액</th>
                                        <th>상태</th>
                                        <th>관리</th>
                                    </tr>
                                    </thead>
                                    <tbody class="align-middle">
                                    <tr th:each="book : ${order.orderedBooks}">
                                        <td class="align-middle text-left" th:text="${book.bookTitle}"></td>
                                        <td class="align-middle" th:text="${book.quantity}"></td>
                                        <td class="align-middle"
                                            th:text="${#numbers.formatInteger(book.finalUnitPrice, 3, 'COMMA')} + '원'"></td>
                                        <td class="align-middle" th:text="${book.unitStatus}"></td>
                                        <td class="align-middle">
                                            <button th:if="${book.unitStatus == 'PAYMENT_COMPLETE'}"
                                                    class="btn btn-warning btn-sm open-cancel-btn"
                                                    th:attr="
                                                    data-ordered-book-id=${book.orderedBookId},
                                                    data-order-number=${order.orderNumber},
                                                    data-unit-price=${book.finalUnitPrice},
                                                    data-quantity=${book.quantity}"> 취소 </button>

                                            <button th:if="${book.unitStatus == 'SHIPPING'}" class="btn btn-info btn-sm">배송조회</button>

                                            <button th:if="${book.unitStatus == 'DELIVERED'}" class="btn btn-danger btn-sm">반품</button>

                                            <a sec:authorize="isAuthenticated()" th:if="${book.unitStatus == 'DELIVERED'}" th:href="@{/reviews/{bookId}/add(bookId=${book.bookId}, orderedBookId=${book.orderedBookId})}"
                                               class="btn btn-info btn-sm">리뷰작성</a>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                                <div class="text-right">
                                    <h5>총 결제 금액: <span class="text-primary"
                                                       th:text="${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')} + '원'"></span>
                                    </h5>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <nav th:if="${pagedResponse.totalPages > 1}" aria-label="Page navigation">
                    <ul class="pagination justify-content-center">
                        <!-- Previous Page Link -->
                        <li class="page-item" th:classappend="${pagedResponse.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/orders/history/list(page=${pagedResponse.number - 1}, size=${pagedResponse.size}, orderNumber=${param.orderNumber}, ordererName=${param.ordererName}, ordererPhone=${param.ordererPhone})}">이전</a>
                        </li>

                        <!-- Page Numbers -->
                        <li class="page-item" th:each="pageNumber : ${#numbers.sequence(0, pagedResponse.totalPages - 1)}"
                            th:classappend="${pageNumber == pagedResponse.number} ? 'active'">
                            <a class="page-link"
                               th:href="@{/orders/history/list(page=${pageNumber}, size=${pagedResponse.size}, orderNumber=${param.orderNumber}, ordererName=${param.ordererName}, ordererPhone=${param.ordererPhone})}"
                               th:text="${pageNumber + 1}"></a>
                        </li>

                        <!-- Next Page Link -->
                        <li class="page-item" th:classappend="${pagedResponse.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/orders/history/list(page=${pagedResponse.number + 1}, size=${pagedResponse.size}, orderNumber=${param.orderNumber}, ordererName=${param.ordererName}, ordererPhone=${param.ordererPhone})}">다음</a>
                        </li>
                    </ul>
                </nav>

            </div>
        </div>
    </div>

    <div class="modal fade" id="cancelModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">취소 사유 입력</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>

                <div class="modal-body">
                    <textarea id="cancelReason" class="form-control" rows="4"
                              placeholder="취소 사유를 입력해주세요"></textarea>

                    <input type="hidden" id="cancelOrderedBookId">
                    <input type="hidden" id="cancelOrderNumber">
                    <input type="hidden" id="cancelAmount">
                    <input type="hidden" id="cancelQuantity">

                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-dismiss="modal">닫기</button>
                    <button class="btn btn-danger" id="submitCancelBtn">취소하기</button>
                </div>

            </div>
        </div>
    </div>
    <script>

        // 버튼 → 모달 오픈 이벤트 등록
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".open-cancel-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    const orderedBookId = btn.dataset.orderedBookId;
                    const orderNumber   = btn.dataset.orderNumber;
                    const unitPrice     = btn.dataset.unitPrice;
                    const quantity      = btn.dataset.quantity;

                    openCancelModal(orderedBookId, orderNumber, unitPrice, quantity);
                });
            });
        });

        // 모달 열기 + 값 세팅
        function openCancelModal(orderedBookId, orderNumber, unitPrice, quantity) {

            const cancelAmount = Number(unitPrice) * Number(quantity);

            $("#cancelOrderedBookId").val(orderedBookId);
            $("#cancelOrderNumber").val(orderNumber);
            $("#cancelAmount").val(cancelAmount);
            $("#cancelQuantity").val(quantity);

            $("#cancelReason").val('');
            $("#cancelModal").modal("show");
        }

        // 취소 요청 제출
        $("#submitCancelBtn").on("click", function () {

            const orderedBookId = $("#cancelOrderedBookId").val();
            const orderNumber   = $("#cancelOrderNumber").val();
            const cancelReason  = $("#cancelReason").val();
            const cancelAmount  = $("#cancelAmount").val();
            const quantity = $("#cancelQuantity").val();


            if (!cancelReason.trim()) {
                alert("취소 사유를 입력해주세요.");
                return;
            }

            const payload = {
                paymentKey: null,
                orderId: orderNumber,
                cancelReason: cancelReason,
                cancelAmount: Number(cancelAmount),
                canceledBooks: [
                    {
                        orderedBookId: Number(orderedBookId),
                        canceledQuantity: Number(quantity)
                    }
                ]
            };

            fetch("/payments/cancel", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload)
            })
                .then(async res => {

                    const data = await res.json().catch(() => null);

                    if (res.ok) {
                        alert("주문이 취소되었습니다.");
                        location.reload();
                        return;
                    }

                    const errorMsg = data?.message || "취소 처리 중 오류가 발생했습니다.";
                    alert(errorMsg);
                })
                .catch(err => {
                    console.error(err);
                    alert("네트워크 오류가 발생했습니다.");
                });
        });

    </script>

</section>
</html>
