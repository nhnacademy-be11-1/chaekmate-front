<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layout/layout :: html(~{::section})}">
<section>
    <link th:href="@{/css/payco.css}" rel="stylesheet">

    <div class="container-fluid">
        <div class="row px-xl-5">

            <!-- Member Login Column -->
            <div class="col-lg-6">
                <div class="bg-light p-30 mb-5">
                    <h2 class="mb-4">회원 로그인</h2>
                    <form th:action="@{/login}" method="post">
                        <div class="row">
                            <div class="col-md-12 form-group">
                                <label for="loginId">Login ID</label>
                                <input type="text" class="form-control" id="loginId" name="loginId" required>
                            </div>
                            <div class="col-md-12 form-group">
                                <label for="password">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div th:if="${error}" class="col-md-12">
                                <div class="text-danger" style="font-size: 14px; margin-bottom: 10px;">
                                    <span th:text="${error}"></span>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <button type="submit" class="btn btn-primary">Login</button>
                            </div>
                            <div class="col-md-12 mt-3 text-center">
                                <span>또는</span>
                            </div>
                            <div class="col-md-12 mt-2">
                                <a th:href="${paycoAuthorizationUrl}" class="payco-login-button">
                                    <span class="payco-logo-text">PAYCO</span>
                                    <span class="payco-login-text">로그인</span>
                                </a>
                            </div>
                            <div class="col-md-12 mt-3 text-center">
                                <span>계정이 없으신가요? </span>
                                <a href="/signup" class="text-primary">회원가입</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Non-Member Order Lookup Column -->
            <div class="col-lg-6">
                <div class="bg-light p-30 mb-5">
                    <h2 class="mb-4">비회원 주문 조회</h2>
                    <form th:action="@{/orders/history/list}" method="get">
                        <input type="hidden" name="_method" value="get"/>
                        <div class="row">
                            <div class="col-md-12 form-group">
                                <label for="orderNumber">주문 번호</label>
                                <input type="text" class="form-control" id="orderNumber" name="orderNumber">
                            </div>
                            <div class="col-md-12 form-group">
                                <label for="ordererPhone">주문자 전화번호</label>
                                <input type="text" class="form-control" id="ordererPhone" name="ordererPhone">
                            </div>
                            <div class="col-md-12">
                                <button type="submit" class="btn btn-primary">주문 조회</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</section>
</html>
